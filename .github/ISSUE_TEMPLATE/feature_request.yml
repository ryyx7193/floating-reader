name: 功能建议
description: 想要一个新功能，或者觉得某个地方可以做得更好
title: "[建议] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        说清楚「你遇到什么麻烦」比说「加一个 XX 按钮」更有用 ——
        前者能让我想到更合适的做法，后者往往只是其中一种实现。

  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题
      description: 现在哪里不顺手，为什么想改
      placeholder: 我经常一边看一边查资料，但切换窗口后阅读器就被挡住了……
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: 你希望怎么做（可选）
      description: 有具体想法就写，没有也没关系
    validations:
      required: false

  - type: textarea
    id: alternative
    attributes:
      label: 你现在怎么绕过去的（可选）
      description: 现在的替代做法，能帮我判断这个需求有多痛
    validations:
      required: false
